[project]
name = "mdnotes"
version = "0.1.0"
description = "An Obsidian-style Markdown notes editor for the terminal"
readme = "README.md"
authors = [
    { name = "Mariano Corvatta", email = "mariano.corvatta@gmail.com" }
]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["markdown", "notes", "tui", "terminal", "textual", "obsidian", "editor"]
classifiers = [
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Editors",
]
requires-python = ">=3.12"
dependencies = [
    "send2trash>=2.1.0",
    "textual[syntax]>=8.2.8",
]

[project.urls]
Homepage = "https://github.com/marianocorvatta/mdnotes"
Issues = "https://github.com/marianocorvatta/mdnotes/issues"

[project.scripts]
mdnotes = "mdnotes:main"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["mdnotes.py"]
